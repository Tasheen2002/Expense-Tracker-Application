# Merge with docker-compose.yml and docker-compose.mailpit.yml using project expense-smoke.
# Secrets come from the ignored .env.docker-smoke. Local email stays in Mailpit.
services:
  gateway:
    container_name: expense_smoke_gateway
    ports: !override ['127.0.0.1:13001:3001']
    environment:
      NODE_ENV: production
  receipt-vault-service:
    container_name: expense_smoke_receipt
    ports: !override ['127.0.0.1:13007:3007']
    environment:
      NODE_ENV: production
  postgres:
    container_name: expense_smoke_postgres
    ports: !override ['127.0.0.1:15432:5432']
  identity-access-service:
    container_name: expense_smoke_identity
    ports: !override ['127.0.0.1:13002:3002']
    environment:
      NODE_ENV: production
  expense-budgeting-service:
    container_name: expense_smoke_expense
    ports: !override ['127.0.0.1:13003:3003']
    environment:
      NODE_ENV: production
  approval-policy-service:
    container_name: expense_smoke_approval
    ports: !override ['127.0.0.1:13005:3005']
    environment:
      NODE_ENV: production
  categorization-service:
    container_name: expense_smoke_categorization
    ports: !override ['127.0.0.1:13004:3004']
    environment:
      NODE_ENV: production
      IDENTITY_SERVICE_URL: http://identity-access-service:3002
      EXPENSE_SERVICE_URL: http://expense-budgeting-service:3003
      AUDIT_SERVICE_URL: http://audit-compliance-service:3009
      NOTIFICATION_SERVICE_URL: http://notification-service:3008
  bank-feed-service:
    container_name: expense_smoke_bank
    ports: !override ['127.0.0.1:13006:3006']
    environment:
      NODE_ENV: production
      # Controlled fixture started by scripts/gateway-workflow-smoke.cjs.
      # Loopback is allowed by the provider adapter; no real bank is contacted.
      BANK_FEED_PROVIDER_URL: http://127.0.0.1:19090/transactions
  notification-service:
    container_name: expense_smoke_notification
    ports: !override ['127.0.0.1:13008:3008']
    environment:
      # Mailpit is intentionally forbidden in production by the application.
      NODE_ENV: development
      IDENTITY_SERVICE_URL: http://identity-access-service:3002
      NOTIFICATION_EMAIL_PROVIDER: mailpit
      MAILPIT_URL: http://mailpit:8025
      NOTIFICATION_EMAIL_FROM: notifications@expense-tracker.test
    depends_on:
      mailpit:
        condition: service_started
  audit-compliance-service:
    container_name: expense_smoke_audit
    ports: !override ['127.0.0.1:13009:3009']
    environment:
      NODE_ENV: production
  mailpit:
    container_name: expense_smoke_mailpit
    ports: !override ['127.0.0.1:18025:8025']
