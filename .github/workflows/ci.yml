name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker
        ports:
          - 5432:5432
        # Wait for postgres to be ready before starting job steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Push Database Schema
        run: pnpm exec prisma db push --accept-data-loss
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker?schema=public

      - name: Lint Check
        run: pnpm lint

      - name: Type Check
        run: pnpm type-check

      - name: Run Tests
        run: pnpm test run --exclude "**/node_modules/**"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker?schema=public
          JWT_SECRET: super-secret-key-change-me-for-ci-runs
          BCRYPT_ROUNDS: 4
