services:
  # ============================================================================
  # Infrastructure
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: expense_tracker_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-1234}'
      POSTGRES_DB: expense_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/setup-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: expense_tracker_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --requirepass '${REDIS_PASSWORD:-redis-secret}'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis-secret}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Downstream Microservices
  # ============================================================================
  identity-access-service:
    build:
      context: .
      dockerfile: apps/identity-access-service/Dockerfile
    container_name: identity_access_service
    restart: unless-stopped
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_identity?schema=public'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET must be configured in .env}'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      AUDIT_SERVICE_URL: 'http://audit-compliance-service:3009'
      NOTIFICATION_SERVICE_URL: 'http://notification-service:3008'
      FRONTEND_URL: 'http://localhost:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3002/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  expense-budgeting-service:
    build:
      context: .
      dockerfile: apps/expense-budgeting-service/Dockerfile
    container_name: expense_budgeting_service
    restart: unless-stopped
    ports:
      - '3003:3003'
    environment:
      PORT: 3003
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_expense?schema=public'
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET must be configured in .env}'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      IDENTITY_SERVICE_URL: 'http://identity-access-service:3002'
      AUDIT_SERVICE_URL: 'http://audit-compliance-service:3009'
      NOTIFICATION_SERVICE_URL: 'http://notification-service:3008'
      FRONTEND_URL: 'http://localhost:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3003/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  categorization-service:
    build:
      context: .
      dockerfile: apps/categorization-service/Dockerfile
    container_name: categorization_service
    restart: unless-stopped
    ports:
      - '3004:3004'
    environment:
      PORT: 3004
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_categorization?schema=public'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      AUDIT_SERVICE_URL: 'http://audit-compliance-service:3009'
      NOTIFICATION_SERVICE_URL: 'http://notification-service:3008'
    depends_on:
      postgres:
        condition: service_healthy

  approval-policy-service:
    build:
      context: .
      dockerfile: apps/approval-policy-service/Dockerfile
    container_name: approval_policy_service
    restart: unless-stopped
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_approval?schema=public'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      EXPENSE_SERVICE_URL: 'http://expense-budgeting-service:3003'
      IDENTITY_SERVICE_URL: 'http://identity-access-service:3002'
      AUDIT_SERVICE_URL: 'http://audit-compliance-service:3009'
      NOTIFICATION_SERVICE_URL: 'http://notification-service:3008'
    depends_on:
      postgres:
        condition: service_healthy
      expense-budgeting-service:
        condition: service_healthy

  bank-feed-service:
    build:
      context: .
      dockerfile: apps/bank-feed-service/Dockerfile
    container_name: bank_feed_service
    restart: unless-stopped
    ports:
      - '3006:3006'
    environment:
      PORT: 3006
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_bank_feed?schema=public'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      BANK_FEED_TOKEN_ENCRYPTION_KEY: '${BANK_FEED_TOKEN_ENCRYPTION_KEY:?BANK_FEED_TOKEN_ENCRYPTION_KEY must be configured in .env}'
      BANK_FEED_PROVIDER_URL: '${BANK_FEED_PROVIDER_URL:-}'
      IDENTITY_SERVICE_URL: 'http://identity-access-service:3002'
      EXPENSE_SERVICE_URL: 'http://expense-budgeting-service:3003'
      AUDIT_SERVICE_URL: 'http://audit-compliance-service:3009'
      NOTIFICATION_SERVICE_URL: 'http://notification-service:3008'
    depends_on:
      postgres:
        condition: service_healthy

  receipt-vault-service:
    build:
      context: .
      dockerfile: apps/receipt-vault-service/Dockerfile
    container_name: receipt_vault_service
    restart: unless-stopped
    ports:
      - '3007:3007'
    environment:
      PORT: 3007
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_receipt?schema=public'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      EXPENSE_SERVICE_URL: 'http://expense-budgeting-service:3003'
      FRONTEND_URL: 'http://localhost:3000'
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    container_name: notification_service
    restart: unless-stopped
    ports:
      - '3008:3008'
    environment:
      PORT: 3008
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_notification?schema=public'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      AUDIT_SERVICE_URL: 'http://audit-compliance-service:3009'
      FRONTEND_URL: 'http://localhost:3000'
    depends_on:
      postgres:
        condition: service_healthy

  audit-compliance-service:
    build:
      context: .
      dockerfile: apps/audit-compliance-service/Dockerfile
    container_name: audit_compliance_service
    restart: unless-stopped
    ports:
      - '3009:3009'
    environment:
      PORT: 3009
      DATABASE_URL: 'postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/expense_tracker_audit?schema=public'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      FRONTEND_URL: 'http://localhost:3000'
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================================
  # API Gateway
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: expense_tracker_gateway
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      JWT_SECRET: '${JWT_SECRET:?JWT_SECRET must be configured in .env}'
      INTERNAL_API_KEY: '${INTERNAL_API_KEY:?INTERNAL_API_KEY must be configured in .env}'
      FRONTEND_URL: 'http://localhost:3000'
      IDENTITY_SERVICE_URL: 'http://identity-access-service:3002'
      EXPENSE_SERVICE_URL: 'http://expense-budgeting-service:3003'
      CATEGORIZATION_SERVICE_URL: 'http://categorization-service:3004'
      APPROVAL_SERVICE_URL: 'http://approval-policy-service:3005'
      BANK_FEED_SERVICE_URL: 'http://bank-feed-service:3006'
      RECEIPT_SERVICE_URL: 'http://receipt-vault-service:3007'
      NOTIFICATION_SERVICE_URL: 'http://notification-service:3008'
      AUDIT_SERVICE_URL: 'http://audit-compliance-service:3009'
    depends_on:
      - identity-access-service
      - expense-budgeting-service
      - categorization-service
      - approval-policy-service
      - bank-feed-service
      - receipt-vault-service
      - notification-service
      - audit-compliance-service

  # ============================================================================
  # Frontend Web App
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: expense_tracker_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: 'http://localhost:3001'
    depends_on:
      - gateway

volumes:
  postgres_data:
